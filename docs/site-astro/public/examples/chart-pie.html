<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart: Pie example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  </head>
  <body class="bg-base-200 p-6 text-base-content">
    <figure class="card bg-base-100 shadow-sm" data-mrn-chart-root>
      <div class="card-body gap-4">
        <figcaption class="space-y-1">
            <h2 class="card-title">Traffic sources</h2>

          </figcaption>
        <div class="relative w-full" style="height: 320px;">
          <canvas data-mrn-chart role="img" aria-label="Traffic sources">
            <p>Traffic sources data is available in the fallback table below.</p>
          </canvas>
        </div>
        <script type="application/json" data-mrn-chart-config>{"data":{"datasets":[{"backgroundColor":"#2563eb","borderColor":["#ffffff","#ffffff","#ffffff"],"data":[48,32,20],"label":"Sessions"}],"labels":["Search","Direct","Referral"]},"options":{"maintainAspectRatio":false,"plugins":{"legend":{"display":true}},"responsive":true},"type":"pie"}</script>
        <details class="sr-only">
          <summary>Traffic sources data is available in the fallback table below.</summary>
          <table>
            <thead>
              <tr>
                <th scope="col">Label</th>
                <th scope="col">Sessions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                  <th scope="row">Search</th>
                  <td>48</td>
                </tr>
              <tr>
                  <th scope="row">Direct</th>
                  <td>32</td>
                </tr>
              <tr>
                  <th scope="row">Referral</th>
                  <td>20</td>
                </tr>
              </tbody>
          </table>
        </details>
      </div>
    </figure>
    <script>
          (function() {
            function initCharts(root) {
              if (!window.Chart) return;
              (root || document).querySelectorAll("[data-mrn-chart]").forEach(function(canvas) {
                var container = canvas.closest("[data-mrn-chart-root]");
                var configEl = container && container.querySelector("[data-mrn-chart-config]");
                if (!configEl) return;
                new window.Chart(canvas, JSON.parse(configEl.textContent || "{}"));
              });
            }
            document.addEventListener("DOMContentLoaded", function() {
              initCharts(document);
            });
          })();
        </script>
  </body>
</html>
