<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart: Scatter example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  </head>
  <body class="bg-base-200 p-6 text-base-content">
    <figure class="card bg-base-100 shadow-sm" data-mrn-chart-root>
      <div class="card-body gap-4">
        <figcaption class="space-y-1">
            <h2 class="card-title">Response time by load</h2>

          </figcaption>
        <div class="relative w-full" style="height: 320px;">
          <canvas data-mrn-chart role="img" aria-label="Response time by load">
            <p>Response time by load data is available in the fallback table below.</p>
          </canvas>
        </div>
        <script type="application/json" data-mrn-chart-config>{"data":{"datasets":[{"borderColor":"#0f766e","data":[{"x":10,"y":80},{"x":40,"y":130},{"x":80,"y":220}],"label":"Requests"}],"labels":null},"options":{"maintainAspectRatio":false,"plugins":{"legend":{"display":true}},"responsive":true,"scales":{"x":{"title":{"display":true,"text":"Requests/sec"}},"y":{"beginAtZero":false,"title":{"display":true,"text":"Latency (ms)"}}}},"type":"scatter"}</script>
        <details class="sr-only">
          <summary>Response time by load data is available in the fallback table below.</summary>
          <table>
            <thead>
              <tr>
                <th scope="col">Label</th>
                <th scope="col">Requests</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </details>
      </div>
    </figure>
    <script>
          (function() {
            function initCharts(root) {
              if (!window.Chart) return;
              (root || document).querySelectorAll("[data-mrn-chart]").forEach(function(canvas) {
                var container = canvas.closest("[data-mrn-chart-root]");
                var configEl = container && container.querySelector("[data-mrn-chart-config]");
                if (!configEl) return;
                new window.Chart(canvas, JSON.parse(configEl.textContent || "{}"));
              });
            }
            document.addEventListener("DOMContentLoaded", function() {
              initCharts(document);
            });
          })();
        </script>
  </body>
</html>
