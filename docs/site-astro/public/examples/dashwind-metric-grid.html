<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DashWind MetricGrid example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>#marionette-root { width: 100%; max-width: none; padding: 0; }
#marionette-root > * { animation: none; }
.dashwind-shell .drawer-side .menu a.active { background: var(--color-primary); color: var(--color-primary-content); font-weight: 700; }
.dashwind-shell .card, .dashwind-shell .stats { border: 1px solid color-mix(in oklab, var(--color-base-content) 10%, transparent); }
.dashwind-shell .stat-value { font-size: clamp(1.75rem, 2vw, 2.25rem); }</style>
  </head>
  <body class="bg-base-200 p-6 text-base-content">
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-4"><div class="card bg-base-100 shadow transition hover:-translate-y-0.5 hover:shadow-md"><div class="card-body gap-3"><div class="flex items-start justify-between gap-4"><div class="space-y-1"><p class="text-sm font-medium text-base-content/60"><span>Revenue</span></p><div class="text-3xl font-bold tracking-tight text-primary"><span>$128.4k</span></div></div><div class="grid h-12 w-12 shrink-0 place-items-center rounded-box bg-primary/10 text-2xl font-bold text-primary"><span>💸</span></div></div><p class="text-sm text-base-content/60"><span>This month</span></p><p class="text-sm font-medium text-success"><span>+12.5% vs last month</span></p></div></div><div class="card bg-base-100 shadow transition hover:-translate-y-0.5 hover:shadow-md"><div class="card-body gap-3"><div class="flex items-start justify-between gap-4"><div class="space-y-1"><p class="text-sm font-medium text-base-content/60"><span>Open tickets</span></p><div class="text-3xl font-bold tracking-tight text-primary"><span>37</span></div></div><div class="grid h-12 w-12 shrink-0 place-items-center rounded-box bg-primary/10 text-2xl font-bold text-primary"><span>🎫</span></div></div><p class="text-sm text-base-content/60"><span>Across support queues</span></p><p class="text-sm font-medium text-warning"><span>5 need review</span></p></div></div><div class="card bg-base-100 shadow transition hover:-translate-y-0.5 hover:shadow-md"><div class="card-body gap-3"><div class="flex items-start justify-between gap-4"><div class="space-y-1"><p class="text-sm font-medium text-base-content/60"><span>Churn risk</span></p><div class="text-3xl font-bold tracking-tight text-primary"><span>4</span></div></div><div class="grid h-12 w-12 shrink-0 place-items-center rounded-box bg-primary/10 text-2xl font-bold text-primary"><span>⚠</span></div></div><p class="text-sm text-base-content/60"><span>Enterprise accounts</span></p><p class="text-sm font-medium text-error"><span>2 escalated</span></p></div></div></div>
  </body>
</html>
