<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DashWind ResourcePage example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>#marionette-root { width: 100%; max-width: none; padding: 0; }
#marionette-root > * { animation: none; }
.dashwind-shell .drawer-side .menu a.active { background: var(--color-primary); color: var(--color-primary-content); font-weight: 700; }
.dashwind-shell .card, .dashwind-shell .stats { border: 1px solid color-mix(in oklab, var(--color-base-content) 10%, transparent); }
.dashwind-shell .stat-value { font-size: clamp(1.75rem, 2vw, 2.25rem); }</style>
  </head>
  <body class="bg-base-200 p-6 text-base-content">
    <div class="space-y-6"><div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between"><div><h1 class="text-3xl font-bold"><span>Accounts</span></h1><p class="mt-1 text-base-content/60"><span>Conventional resource page with header actions, filters, table, and row actions.</span></p></div><a class="btn btn-primary btn-sm" href="#"><span>New account</span></a></div><div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between"><div class="w-full md:max-w-sm"><input class="input w-full" name="q" placeholder="Search accounts" type="search"></input></div></div><div class="overflow-x-auto"><table class="table"><thead><tr><th>Account</th><th>Plan</th><th class="w-0"></th></tr></thead><tbody><tr><td><span>Acme Co</span></td><td><span class="badge">Enterprise</span></td><td class="text-right"><div class="flex items-center gap-2 justify-end"><a class="btn btn-ghost btn-xs" href="#"><span>Open</span></a></div></td></tr><tr><td><span>Globex</span></td><td><span class="badge">Team</span></td><td class="text-right"><div class="flex items-center gap-2 justify-end"><a class="btn btn-ghost btn-xs" href="#"><span>Open</span></a></div></td></tr></tbody></table></div></div>
  </body>
</html>
