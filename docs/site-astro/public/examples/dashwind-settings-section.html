<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DashWind SettingsSection example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>#marionette-root { width: 100%; max-width: none; padding: 0; }
#marionette-root > * { animation: none; }
.dashwind-shell .drawer-side .menu a.active { background: var(--color-primary); color: var(--color-primary-content); font-weight: 700; }
.dashwind-shell .card, .dashwind-shell .stats { border: 1px solid color-mix(in oklab, var(--color-base-content) 10%, transparent); }
.dashwind-shell .stat-value { font-size: clamp(1.75rem, 2vw, 2.25rem); }</style>
  </head>
  <body class="bg-base-200 p-6 text-base-content">
    <div class="card bg-base-100 shadow"><div class="card-body"><h2 class="card-title">Workspace settings</h2><p class="text-sm text-base-content/60">Card-backed form section with labels, help text, and submit actions.</p><form class="space-y-4"><div class="w-full space-y-1"><label class="label pb-1" for="dashwind-field-workspace-name"><span>Workspace name</span></label><input aria-required="true" class="input w-full" id="dashwind-field-workspace-name" name="workspace-name" required="required" type="text" value="Growth Ops"></input></div><div class="w-full space-y-1"><label class="label pb-1" for="dashwind-field-notification-email"><span>Notification email</span></label><input class="input w-full" id="dashwind-field-notification-email" name="notification-email" type="email" value="ops@example.com"></input><p class="mt-1 text-xs text-base-content/60"><span>Weekly summary recipient.</span></p></div><div class="pt-2 text-right"><button class="btn btn-primary btn-sm" type="submit">Save changes</button></div></form></div></div>
  </body>
</html>
