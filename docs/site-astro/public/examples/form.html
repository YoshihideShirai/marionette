<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./form-primitives.css" />
  </head>
  <body class="p-6 bg-base-100 text-base-content">
    <form class="flex flex-col gap-3" hx-post="/users" hx-swap="outerHTML" hx-target="#app"><fieldset class="fieldset w-full"><legend class="fieldset-legend">Name *</legend><input class="input input-bordered w-full" name="name" type="text" value=""></input><p class="label">Enter a display name.</p></fieldset><button class="btn w-fit btn-primary" type="submit">Create user</button></form>
  </body>
</html>
