<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-6 bg-base-100 text-base-content">
    <div class="flex items-center gap-2"><a class="link link-hover w-fit" href="/dashboard"><span>View dashboard</span></a><a class="link link-hover w-fit" href="https://example.com/docs" target="_blank" rel="noopener noreferrer"><span>Open docs</span></a><a class="btn w-fit btn-ghost btn-sm btn-square" href="https://example.com/docs" target="_blank" rel="noopener noreferrer" aria-label="Open docs in a new tab"><span class="ui-icon material-icons" aria-hidden="true">↗</span></a><a class="btn w-fit btn-primary btn-sm" href="/reports/users.csv" download="users.csv"><span>Download CSV</span></a></div>
  </body>
</html>
