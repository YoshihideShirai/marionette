<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-6 bg-base-100 text-base-content">
    <dialog class="modal" open="open"><div class="modal-box"><h3 class="font-bold text-lg">Delete user</h3><p class="">Confirm deletion before continuing.</p><div class="modal-action"><div class="flex items-center gap-2"><button class="btn w-fit btn-ghost btn-sm" type="button">Cancel</button><button class="btn w-fit btn-error btn-sm" type="button">Delete</button></div></div></div><form class="modal-backdrop" method="dialog"><button>close</button></form></dialog>
  </body>
</html>
