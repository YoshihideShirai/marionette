<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navigation stories</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./navigation-primitives.css" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f8fafc; }
      h1,h2 { margin: 0; }
      .stack { display: grid; gap: 16px; max-width: 920px; }
      .caption { color: #475569; font-size: 14px; }
      .view { display: none; }
      .view.is-active { display: block; }
      .route-switch { display: flex; gap: 8px; }
      .route-switch button { border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; padding: 6px 10px; cursor: pointer; }
      .log { font-size: 13px; color: #334155; background: #fff; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 8px; }
    </style>
  </head>
  <body>
    <div class="flex flex-col gap-6 items-stretch justify-start"><nav aria-label="breadcrumb" class="breadcrumbs text-sm">
      <ul>

        <li>

          <a href="/" >Home</a>

        </li>

        <li>

          <span aria-current="page">Users</span>

        </li>

      </ul>
    </nav><div role="tablist" aria-label="tabs" class="tabs tabs-boxed">


        <a
          role="tab"
          href="/profile"
          class="tab tab-active"
          aria-selected="true"
          aria-current="page"

        >Profile</a>



        <a
          role="tab"
          href="/settings"
          class="tab"
          aria-selected="false"


        >Settings</a>


    </div>
    <div class="flex items-center justify-end gap-3 px-4 py-3">

      <a href="?page=1" class="btn btn-ghost btn-sm">Prev</a>

      <span class="text-sm text-base-content/70">Page 2 / 5</span>

      <a href="?page=3" class="btn btn-ghost btn-sm">Next</a>

    </div>
    </div>
  </body>
</html>
