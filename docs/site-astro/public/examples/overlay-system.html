<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay System example</title><link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" /><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>body{font-family:system-ui;padding:16px}.overlay{position:relative;height:220px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc}.modal{position:absolute;inset:40px auto auto 40px;width:260px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 20px 40px rgba(15,23,42,.18);padding:12px}</style></head><body>
    <dialog class="modal" open="open"><div class="modal-box"><h3 class="font-bold text-lg">Overlay demo</h3><p class="">Modal uses the shared overlay layer in the runtime shell.</p><div class="modal-action"><button class="btn w-fit btn-ghost btn-sm" type="button">Close</button></div></div><form class="modal-backdrop" method="dialog"><button>close</button></form></dialog>
  </body></html>
