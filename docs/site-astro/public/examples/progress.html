<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Progress example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <body class="bg-base-200 p-6 text-base-content">
    <div class="flex flex-col gap-6 items-stretch justify-start"><progress class="progress w-full progress-success h-4" max="100" value="72"><span>Upload progress</span></progress><progress class="progress w-full progress-info h-1" max="100"><span>Preparing import</span></progress></div>
