<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioGroup example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-base-100 p-6 text-base-content">
    <div class="space-y-2"><label class="label cursor-pointer gap-2"><input class="radio" name="role" type="radio" value="admin"></input><span class="label">Admin</span></label><label class="label cursor-pointer gap-2"><input checked="checked" class="radio" name="role" type="radio" value="viewer"></input><span class="label">Viewer</span></label></div>
  </body>
</html>
