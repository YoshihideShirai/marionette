<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TableWithVariants example</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" /></head>
<body class="p-6 bg-base-100">
  <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
    <table class="table table-zebra table-pin-rows table-sm">
      <thead><tr><th>Name</th><th>Role</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Ayaka</td><td>Owner</td><td><span class="badge badge-success">Active</span></td></tr>
        <tr><td>Ken</td><td>Editor</td><td><span class="badge badge-warning">Review</span></td></tr>
        <tr><td>Mina</td><td>Viewer</td><td><span class="badge">Idle</span></td></tr>
      </tbody>
    </table>
  </div>
</body></html>
