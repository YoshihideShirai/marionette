<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>theme-controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  </head>
  <body class="p-6 bg-base-200">
    <div class="space-y-8"><div><input aria-label="light" class="theme-controller btn" name="theme-buttons" type="radio" value="light"></input><input aria-label="dark" class="theme-controller btn" name="theme-buttons" type="radio" value="dark"></input><input aria-label="cupcake" checked="checked" class="theme-controller btn" name="theme-buttons" type="radio" value="cupcake"></input><input aria-label="dracula" class="theme-controller btn" name="theme-buttons" type="radio" value="dracula"></input></div><div><input aria-label="corporate" checked="checked" class="theme-controller radio radio-xs" name="theme-buttons" type="radio" value="corporate"></input><input aria-label="forest" class="theme-controller radio radio-xs" name="theme-buttons" type="radio" value="forest"></input><input aria-label="luxury" class="theme-controller radio radio-xs" name="theme-buttons" type="radio" value="luxury"></input><input aria-label="night" class="theme-controller radio radio-xs" name="theme-buttons" type="radio" value="night"></input></div><div class="space-y-2"><label class="label cursor-pointer gap-2 w-fit"><span class="label"><span>Dark</span></span><input class="toggle theme-controller" type="checkbox" value="dark"></input></label><label class="label cursor-pointer gap-2 w-fit"><span class="label"><span>Retro</span></span><input class="checkbox theme-controller" type="checkbox" value="retro"></input></label></div><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"><label class="cursor-pointer"><input class="theme-controller sr-only" name="theme-picker" type="radio" value="light"></input><span class="block rounded-box border border-base-300 p-2"><span class="font-semibold text-xs"><span>Light</span></span><div class="mt-2 grid grid-cols-4 gap-1"><span class="h-3 rounded bg-primary"></span><span class="h-3 rounded bg-secondary"></span><span class="h-3 rounded bg-accent"></span><span class="h-3 rounded bg-neutral"></span></div></span></label><label class="cursor-pointer"><input class="theme-controller sr-only" name="theme-picker" type="radio" value="cupcake"></input><span class="block rounded-box border border-base-300 p-2"><span class="font-semibold text-xs"><span>Cupcake</span></span><div class="mt-2 grid grid-cols-4 gap-1"><span class="h-3 rounded bg-primary"></span><span class="h-3 rounded bg-secondary"></span><span class="h-3 rounded bg-accent"></span><span class="h-3 rounded bg-neutral"></span></div></span></label><label class="cursor-pointer"><input class="theme-controller sr-only" name="theme-picker" type="radio" value="emerald"></input><span class="block rounded-box border border-base-300 p-2"><span class="font-semibold text-xs"><span>Emerald</span></span><div class="mt-2 grid grid-cols-4 gap-1"><span class="h-3 rounded bg-primary"></span><span class="h-3 rounded bg-secondary"></span><span class="h-3 rounded bg-accent"></span><span class="h-3 rounded bg-neutral"></span></div></span></label><label class="cursor-pointer"><input class="theme-controller sr-only" name="theme-picker" type="radio" value="night"></input><span class="block rounded-box border border-base-300 p-2"><span class="font-semibold text-xs"><span>Night</span></span><div class="mt-2 grid grid-cols-4 gap-1"><span class="h-3 rounded bg-primary"></span><span class="h-3 rounded bg-secondary"></span><span class="h-3 rounded bg-accent"></span><span class="h-3 rounded bg-neutral"></span></div></span></label><label class="cursor-pointer"><input class="theme-controller sr-only" name="theme-picker" type="radio" value="dracula"></input><span class="block rounded-box border border-base-300 p-2"><span class="font-semibold text-xs"><span>Dracula</span></span><div class="mt-2 grid grid-cols-4 gap-1"><span class="h-3 rounded bg-primary"></span><span class="h-3 rounded bg-secondary"></span><span class="h-3 rounded bg-accent"></span><span class="h-3 rounded bg-neutral"></span></div></span></label></div><fieldset class="fieldset w-full max-w-xs"><legend class="fieldset-legend"><span>Choose a theme</span></legend><select class="select theme-controller" name="theme-picker"><option value="light"><span>Light</span></option><option value="cupcake"><span>Cupcake</span></option><option value="bumblebee"><span>Bumblebee</span></option><option value="synthwave"><span>Synthwave</span></option><option value="forest"><span>Forest</span></option><option value="black"><span>Black</span></option></select></fieldset></div>
  </body>
</html>
