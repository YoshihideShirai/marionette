<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThemeToggleButton</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-base-100 p-6">
    <button aria-label="Toggle theme: system, light, dark" aria-pressed="false" class="btn btn-ghost" data-mrn-theme-mode="system" data-mrn-theme-toggle="true" onclick="globalThis.mrnToggleTheme()" type="button"><span>🌓 Theme: </span><span data-mrn-theme-label="true">System</span></button>
  </body>
</html>
