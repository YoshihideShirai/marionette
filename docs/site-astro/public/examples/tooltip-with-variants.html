<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TooltipWithVariants example</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" /></head>
<body class="p-6 bg-base-100">
  <div class="flex flex-wrap gap-3">
    <div class="tooltip" data-tip="Default tooltip"><button class="btn">Default</button></div>
    <div class="tooltip tooltip-primary tooltip-open" data-tip="Primary always open"><button class="btn btn-primary">Primary</button></div>
    <div class="tooltip tooltip-bottom" data-tip="Bottom placement"><button class="btn btn-secondary">Bottom</button></div>
  </div>
</body></html>
