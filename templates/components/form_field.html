{{define "components/form_field" -}}
<fieldset class="fieldset w-full">
  {{if .Label}}
  <legend class="fieldset-legend">
    {{.Label}}{{if .Required}} <span class="text-error">*</span>{{end}}
  </legend>
  {{end}}
  {{.Control}}
  {{if .Hint}}<p class="label text-base-content/60">{{.Hint}}</p>{{end}}
  {{if .Error}}<p class="label text-error">{{.Error}}</p>{{end}}
</fieldset>
{{- end}}
